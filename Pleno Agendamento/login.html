<!DOCTYPE html>
<html lang="pt-br">
<head>

  <title>Pleno Agendamento</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="topo">

      <img src="logo.png" alt="Logo">

  </div>

  <div class="fundo">
    <div class="login">
      <br>
      <h2>Faça o seu login</h2>

      </div>
      <br>
      <div class="campo">
        <img id="senha" src="senha.png" alt="" width="40px">
        <input type="password" placeholder="Senha">
      </div>
      <br>
      <br>

      <a href="index.html"><button type="submit">Entrar</button></a>

      <div class="links">
        <a href="esqueceu.html">Esqueceu a senha?</a>
        <a href="cadrastro.html">Cadastre-se</a>
      </div>
    </div>
  </div>

  <footer>
    <a href="#">Políticas de Privacidade</a>
    <a href="#">Termos de Uso</a>
  </footer>

</body>
</html>
