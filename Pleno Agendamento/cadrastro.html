<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pleno Agendamento</title>
  <link rel="stylesheet" href="cadrastro.css">
</head>
<body>

  <div class="topo">
    <div class="logo">
      <img src="logo.png" alt="Logo">
      <h1>PLENO<br>AGENDAMENTO</h1>
    </div>
  </div>

  <div class="fundo">
    <div class="login">
      <br>
      <h2>Crie o seu cadrastro</h2>
      <br><br><br>

      <div class="campo">
      <input type="text" placeholder="Nome de usuário">
      </div>
      <br>
      <div class="campo">
        <input type="email" placeholder="E-mail">
      </div>
      <br>
      <div class="campo">
        <input type="password" placeholder="Senha">
      </div>
      <br>
      <br>

      <div class="cancelar">
      <a href="login.html"><button class="cancelar">Cadastre-se</button></a>
      </div>

    </div>
  </div>
  <footer>
    <a href="#">Políticas de Privacidade</a>
    <a href="#">Termos de Uso</a>
  </footer>

</body>
</html>
</body>
</html>
